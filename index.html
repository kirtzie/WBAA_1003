<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Login · Rohtak Public School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="login-wrap">
  <div class="login-brand">
    <div class="eyebrow">Student Management System</div>
    <h1>Rohtak Public School</h1>
    <p>One place for admissions, attendance and student records — built for the school office.</p>
  </div>

  <div class="login-form-side">
    <div class="login-card">
      <h2>Welcome back</h2>
      <p class="sub">Sign in with your admin account to continue.</p>

      <form id="loginForm">
        <div class="field">
          <label for="email">Email</label>
          <input type="email" id="email" required autocomplete="username" placeholder="admin@school.in" />
        </div>
        <div class="field">
          <label for="password">Password</label>
          <input type="password" id="password" required autocomplete="current-password" placeholder="••••••••" />
        </div>
        <button type="submit" class="btn-primary" id="loginBtn">Sign in</button>
        <div class="form-msg" id="formMsg"></div>
      </form>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script>
  // If already logged in, skip straight to dashboard
  (async () => {
    const { data: { session } } = await supabase.auth.getSession();
    if (session) window.location.href = "dashboard.html";
  })();

  const form = document.getElementById("loginForm");
  const msg = document.getElementById("formMsg");
  const btn = document.getElementById("loginBtn");

  form.addEventListener("submit", async (e) => {
    e.preventDefault();
    msg.className = "form-msg";
    btn.textContent = "Signing in…";
    btn.disabled = true;

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;

    const { error } = await supabase.auth.signInWithPassword({ email, password });

    if (error) {
      msg.textContent = error.message || "Could not sign in. Check your email and password.";
      msg.className = "form-msg error";
      btn.textContent = "Sign in";
      btn.disabled = false;
      return;
    }

    window.location.href = "dashboard.html";
  });
</script>
</body>
</html>
