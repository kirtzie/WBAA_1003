<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard · Rohtak Public School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Rohtak Public School</div>
    <div class="brand-sub">Student Management</div>

    <nav>
      <a href="dashboard.html" class="nav-item active"><span class="dot"></span>Dashboard</a>
      <a href="students.html" class="nav-item"><span class="dot"></span>Students</a>
      <a href="attendance.html" class="nav-item"><span class="dot"></span>Attendance</a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Dashboard</h1>
        <div class="sub" id="todayLabel"></div>
      </div>
    </div>

    <div class="stat-grid">
      <div class="stat-card">
        <div class="stat-label">Total Students</div>
        <div class="stat-value" id="statTotal">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Present Today</div>
        <div class="stat-value success" id="statPresent">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Absent Today</div>
        <div class="stat-value accent" id="statAbsent">–</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Classes</div>
        <div class="stat-value" id="statClasses">–</div>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <h3>Recently added students</h3>
        <a href="students.html" class="btn-ghost">View all</a>
      </div>
      <table>
        <thead>
          <tr>
            <th>Student</th>
            <th>Roll No.</th>
            <th>Class</th>
            <th>Parent contact</th>
          </tr>
        </thead>
        <tbody id="recentBody">
          <tr><td colspan="4" class="loading">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/dashboard.js"></script>
</body>
</html>
