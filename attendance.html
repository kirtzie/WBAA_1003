<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Attendance · Rohtak Public School</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css" />
</head>
<body>

<div class="app-shell">
  <aside class="sidebar">
    <div class="brand">Rohtak Public School</div>
    <div class="brand-sub">Student Management</div>

    <nav>
      <a href="dashboard.html" class="nav-item"><span class="dot"></span>Dashboard</a>
      <a href="students.html" class="nav-item"><span class="dot"></span>Students</a>
      <a href="attendance.html" class="nav-item active"><span class="dot"></span>Attendance</a>
    </nav>

    <div class="sidebar-footer">
      <button class="logout-btn" onclick="logout()">Log out</button>
    </div>
  </aside>

  <main class="main">
    <div class="page-header">
      <div>
        <h1>Attendance</h1>
        <div class="sub">Mark today's attendance, or pick another date below.</div>
      </div>
    </div>

    <div class="card" style="margin-bottom:16px;">
      <div class="card-header">
        <div class="toolbar">
          <select id="classFilter">
            <option value="">All classes</option>
          </select>
          <input type="date" id="dateInput" />
        </div>
        <button class="btn-accent" id="saveAllBtn">Save attendance</button>
      </div>
      <div id="attendanceList">
        <div class="loading">Loading students…</div>
      </div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/attendance.js"></script>
</body>
</html>
